<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
  >

  <title>Last Finger</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(
          circle at center,
          #202d60 0%,
          #0b1025 45%,
          #02030a 100%
        );
      color: white;
    }

    #game {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
    }

    /* =========================
       TITLE
    ========================= */

    #title {
      position: absolute;
      top: 22px;
      left: 0;
      width: 100%;

      text-align: center;

      font-size: 27px;
      font-weight: 900;
      letter-spacing: 5px;

      z-index: 20;
      pointer-events: none;

      text-shadow:
        0 0 20px rgba(255,255,255,.35);
    }

    #status {
      position: absolute;
      top: 66px;
      left: 0;
      width: 100%;

      text-align: center;

      font-size: 13px;
      color: #aab4d5;

      z-index: 20;
      pointer-events: none;
    }

    #counter {
      position: absolute;

      top: 95px;
      right: 16px;

      padding: 7px 12px;

      border-radius: 20px;

      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.1);

      font-size: 12px;
      font-weight: bold;

      color: #b5bfdf;

      z-index: 30;
      pointer-events: none;
    }

    /* =========================
       ARENA
    ========================= */

    #arena {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      touch-action: none;
    }

    /* =========================
       FINGER
    ========================= */

    .finger {
      position: absolute;

      width: 78px;
      height: 78px;

      transform:
        translate(-50%, -50%)
        scale(1);

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;

      font-size: 25px;
      font-weight: 900;

      background:
        radial-gradient(
          circle at 30% 25%,
          #ffffff 0%,
          #9db3ff 13%,
          #4d6dff 45%,
          #1c288c 100%
        );

      border: 3px solid white;

      box-shadow:
        0 0 18px #5578ff,
        0 0 45px rgba(70,100,255,.7);

      pointer-events: none;

      z-index: 10;

      transition:
        opacity .3s ease,
        filter .3s ease;
    }

    .finger::after {
      content: "";

      position: absolute;
      inset: -9px;

      border-radius: 50%;

      border: 2px solid rgba(100,140,255,.2);

      animation: ring 1.5s infinite;
    }

    @keyframes ring {
      0% {
        transform: scale(.8);
        opacity: .8;
      }

      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }

    /* =========================
       RANDOM
    ========================= */

    .finger.active {
      animation:
        randomPulse .15s infinite alternate;

      box-shadow:
        0 0 20px white,
        0 0 50px #6688ff,
        0 0 100px rgba(60,90,255,.9);
    }

    @keyframes randomPulse {
      from {
        transform:
          translate(-50%, -50%)
          scale(1.15);
      }

      to {
        transform:
          translate(-50%, -50%)
          scale(1.55);
      }
    }

    /* =========================
       LOSER
    ========================= */

    .finger.loser {
      background:
        radial-gradient(
          circle at 30% 25%,
          white 0%,
          #ffaaaa 12%,
          #ff2929 45%,
          #730000 100%
        );

      box-shadow:
        0 0 25px red,
        0 0 65px #ff2020,
        0 0 130px rgba(255,0,0,.9);

      animation:
        loserShake .1s infinite alternate;

      z-index: 100;
    }

    @keyframes loserShake {
      from {
        transform:
          translate(-53%, -50%)
          scale(1.55)
          rotate(-6deg);
      }

      to {
        transform:
          translate(-47%, -50%)
          scale(1.85)
          rotate(6deg);
      }
    }

    .finger.disappear {
      opacity: 0;

      filter: blur(12px);

      transform:
        translate(-50%, -50%)
        scale(.1);
    }

    /* =========================
       START
    ========================= */

    #start {
      position: absolute;

      left: 50%;
      bottom: 55px;

      transform: translateX(-50%);

      width: 220px;
      height: 65px;

      border: 0;
      border-radius: 20px;

      color: white;

      font-size: 20px;
      font-weight: 900;

      letter-spacing: 3px;

      background:
        linear-gradient(
          135deg,
          #5577ff,
          #783dff
        );

      box-shadow:
        0 10px 35px rgba(70,80,255,.55),
        inset 0 1px 1px rgba(255,255,255,.4);

      z-index: 1000;

      cursor: pointer;

      touch-action: manipulation;
    }

    #start:active {
      transform:
        translateX(-50%)
        scale(.93);
    }

    #start.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* =========================
       RESULT
    ========================= */

    #result {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        rgba(0,0,0,.76);

      backdrop-filter: blur(10px);

      opacity: 0;
      pointer-events: none;

      transition: opacity .4s;

      z-index: 2000;
    }

    #result.show {
      opacity: 1;
      pointer-events: auto;
    }

    .result-box {
      width: 85%;
      max-width: 390px;

      padding: 35px 25px;

      border-radius: 28px;

      text-align: center;

      background:
        linear-gradient(
          145deg,
          #1b2344,
          #080b18
        );

      border:
        1px solid rgba(255,255,255,.12);

      box-shadow:
        0 30px 100px rgba(0,0,0,.8);
    }

    .result-small {
      color: #a8b2d3;

      font-size: 13px;
      letter-spacing: 3px;

      margin-bottom: 12px;
    }

    #loserText {
      font-size: 38px;
      font-weight: 1000;

      color: #ff3939;

      margin-bottom: 25px;

      text-shadow:
        0 0 25px rgba(255,0,0,.8);
    }

    #again {
      width: 100%;
      height: 58px;

      border: 0;
      border-radius: 16px;

      color: white;

      font-size: 17px;
      font-weight: 900;

      letter-spacing: 2px;

      background:
        linear-gradient(
          135deg,
          #5577ff,
          #783dff
        );
    }
  </style>
</head>

<body>

<div id="game">

  <div id="title">
    LAST FINGER
  </div>

  <div id="status">
    START ni bosing
  </div>

  <div id="counter">
    0 / 8
  </div>

  <div id="arena"></div>

  <button id="start">
    START
  </button>

  <div id="result">

    <div class="result-box">

      <div class="result-small">
        THE LOSER IS
      </div>

      <div id="loserText">
        PLAYER 1
      </div>

      <button id="again">
        PLAY AGAIN
      </button>

    </div>

  </div>

</div>


<script>

  const arena =
    document.getElementById("arena");

  const start =
    document.getElementById("start");

  const status =
    document.getElementById("status");

  const counter =
    document.getElementById("counter");

  const result =
    document.getElementById("result");

  const loserText =
    document.getElementById("loserText");

  const again =
    document.getElementById("again");


  const MAX_PLAYERS = 8;


  /*
    GAME STATE

    idle
    = START kutmoqda

    placing
    = START bosildi,
      odamlar barmoqlarini qo'ymoqda

    waiting
    = oxirgi barmoqdan keyin
      1.5 sekund kutmoqda

    random
    = tanlash boshlandi

    finished
    = o'yin tugadi
  */

  let state = "idle";


  /*
    Barcha o'yinchilar
  */

  let players = new Map();


  let playerNumber = 0;


  /*
    Oxirgi barmoq qachon
    qo'yilganini kuzatish
  */

  let waitingTimer = null;


  /*
    Random timer
  */

  let randomTimer = null;


  let selectedPlayer = null;


  let audioContext = null;


  /* ==================================================
       AUDIO
  ================================================== */

  function initAudio() {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }
  }


  function sound(
    frequency,
    duration,
    volume,
    type = "sine"
  ) {

    if (!audioContext) return;


    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.type = type;

    oscillator.frequency.value =
      frequency;


    gain.gain.setValueAtTime(
      volume,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime +
      duration
    );


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();

    oscillator.stop(
      audioContext.currentTime +
      duration
    );
  }


  function fingerSound() {

    sound(
      550,
      .08,
      .045,
      "sine"
    );

  }


  function randomSound() {

    sound(
      300 +
      Math.random() * 500,

      .055,

      .035,

      "square"
    );

  }


  function loserSound() {

    /*
      BALAND OVOZ
    */

    sound(
      850,
      .15,
      .17,
      "sawtooth"
    );


    setTimeout(() => {

      sound(
        600,
        .18,
        .19,
        "sawtooth"
      );

    }, 120);


    setTimeout(() => {

      sound(
        300,
        .25,
        .21,
        "sawtooth"
      );

    }, 260);


    setTimeout(() => {

      sound(
        110,
        .55,
        .23,
        "square"
      );

    }, 420);

  }


  /* ==================================================
       COUNTER
  ================================================== */

  function updateCounter() {

    counter.textContent =
      players.size +
      " / " +
      MAX_PLAYERS;

  }


  /* ==================================================
       START BUTTON
  ================================================== */

  start.addEventListener(
    "click",
    function(event) {

      event.preventDefault();

      event.stopPropagation();


      /*
        Audio ruxsati
      */

      initAudio();


      /*
        Faqat idle paytida
      */

      if (state !== "idle") {
        return;
      }


      /*
        ENG MUHIM JOY:

        START bosilganda
        o'yin placing holatiga
        o'tadi.

        Random DARHOL
        boshlanmaydi.
      */

      state = "placing";


      start.classList.add(
        "hidden"
      );


      status.textContent =
        "Barmoqlaringizni qo'ying";


      /*
        Endi odamlar barmoqlarini
        qo'yishi mumkin.
      */

    }
  );


  /* ==================================================
       FINGER DOWN
  ================================================== */

  arena.addEventListener(
    "pointerdown",
    function(event) {

      event.preventDefault();


      /*
        Faqat placing holatida
      */

      if (
        state !== "placing"
      ) {

        return;

      }


      /*
        8 ta maximum
      */

      if (
        players.size >=
        MAX_PLAYERS
      ) {

        status.textContent =
          "MAXIMUM 8 PLAYERS";

        return;

      }


      /*
        Bir pointer ikki marta
        qo'shilmasin
      */

      if (
        players.has(
          event.pointerId
        )
      ) {

        return;

      }


      /*
        Yangi finger
      */

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "finger";


      const number =
        ++playerNumber;


      element.textContent =
        number;


      element.style.left =
        event.clientX + "px";


      element.style.top =
        event.clientY + "px";


      arena.appendChild(
        element
      );


      players.set(
        event.pointerId,
        {
          id:
            event.pointerId,

          number:
            number,

          element:
            element
        }
      );


      updateCounter();


      fingerSound();


      status.textContent =
        players.size +
        " PLAYERS";


      /*
        MUHIM:

        Har safar yangi barmoq
        qo'yilganda 1.5 sekundlik
        timer qayta boshlanadi.

        Demak:

        Player 1 qo'ydi
        ↓
        timer

        Player 2 qo'ydi
        ↓
        timer qayta

        Player 3 qo'ydi
        ↓
        timer qayta

        Oxirgi odam qo'ydi
        ↓
        1.5 sec
        ↓
        RANDOM
      */

      startWaitingTimer();

    },
    {
      passive: false
    }
  );


  /* ==================================================
       FINGER MOVE
  ================================================== */

  arena.addEventListener(
    "pointermove",
    function(event) {

      if (
        state !== "placing"
      ) {

        return;

      }


      const player =
        players.get(
          event.pointerId
        );


      if (!player) {
        return;
      }


      player.element.style.left =
        event.clientX + "px";


      player.element.style.top =
        event.clientY + "px";

    }
  );


  /* ==================================================
       POINTER UP

       MUHIM:
       Barmoqni ko'tarsa ham
       player o'chirilmaydi.

       Chunki bu o'yinda
       hamma qo'lini qo'yib
       turadi.
  ================================================== */

  arena.addEventListener(
    "pointerup",
    function(event) {

      event.preventDefault();

    }
  );


  arena.addEventListener(
    "pointercancel",
    function(event) {

      event.preventDefault();

    }
  );


  /* ==================================================
       1.5 SECOND WAIT
  ================================================== */

  function startWaitingTimer() {


    /*
      Oldingi timer bo'lsa
      to'xtatamiz.
    */

    if (waitingTimer) {

      clearTimeout(
        waitingTimer
      );

    }


    state = "waiting";


    status.textContent =
      players.size +
      " PLAYERS — READY";


    /*
      Oxirgi barmoqdan keyin
      1.5 sekund.

      Shu paytda boshqa odam
      barmog'ini qo'ysa,
      timer yana 1.5 sekundga
      qaytadi.
    */

    waitingTimer =
      setTimeout(
        function() {

          if (
            players.size === 0
          ) {

            state = "placing";

            return;

          }


          startRandom();

        },
        1500
      );

  }


  /* ==================================================
       RANDOM
  ================================================== */

  function startRandom() {


    state = "random";


    status.textContent =
      "RANDOM...";


    const list =
      Array.from(
        players.values()
      );


    let round = 0;

    let previous = null;


    function nextRound() {


      /*
        Oldingi active
        olib tashlanadi.
      */

      list.forEach(
        player => {

          player.element
            .classList
            .remove(
              "active"
            );

        }
      );


      /*
        Random player
      */

      let randomPlayer;


      do {

        randomPlayer =
          list[
            Math.floor(
              Math.random() *
              list.length
            )
          ];

      } while (
        list.length > 1 &&
        randomPlayer === previous
      );


      previous =
        randomPlayer;


      selectedPlayer =
        randomPlayer;


      /*
        Kattalashadi
      */

      randomPlayer.element
        .classList
        .add(
          "active"
        );


      /*
        Ovoz
      */

      randomSound();


      round++;


      /*
        Avval sekin
        keyin tez
      */

      const speed =
        Math.max(
          45,
          230 -
          round * 5
        );


      /*
        42 marta aylanish
      */

      if (
        round >= 42
      ) {

        setTimeout(
          function() {

            finishGame();

          },
          600
        );

        return;

      }


      randomTimer =
        setTimeout(
          nextRound,
          speed
        );

    }


    nextRound();

  }


  /* ==================================================
       FINISH
  ================================================== */

  function finishGame() {


    state = "finished";


    if (randomTimer) {

      clearTimeout(
        randomTimer
      );

    }


    const loser =
      selectedPlayer;


    if (!loser) {
      return;
    }


    /*
      Active olib tashlanadi
    */

    loser.element
      .classList
      .remove(
        "active"
      );


    /*
      Boshqa barcha fingerlar
      yo'qoladi
    */

    players.forEach(
      player => {

        if (
          player !== loser
        ) {

          player.element
            .classList
            .add(
              "disappear"
            );

        }

      }
    );


    /*
      LOSER qizil
    */

    loser.element
      .classList
      .add(
        "loser"
      );


    status.textContent =
      "PLAYER " +
      loser.number +
      " LOST";


    /*
      BALAND OVOZ
    */

    loserSound();


    /*
      Natija oynasi
    */

    setTimeout(
      function() {

        loserText.textContent =
          "PLAYER " +
          loser.number;


        result.classList
          .add(
            "show"
          );

      },
      1100
    );

  }


  /* ==================================================
       PLAY AGAIN
  ================================================== */

  again.addEventListener(
    "click",
    function(event) {

      event.preventDefault();

      event.stopPropagation();


      /*
        Timerlarni tozalash
      */

      clearTimeout(
        waitingTimer
      );

      clearTimeout(
        randomTimer
      );


      /*
        Fingerlarni o'chirish
      */

      players.forEach(
        player => {

          player.element.remove();

        }
      );


      players.clear();


      playerNumber = 0;

      selectedPlayer = null;

      waitingTimer = null;

      randomTimer = null;


      /*
        Boshlang'ich holat
      */

      state = "idle";


      result.classList
        .remove(
          "show"
        );


      start.classList
        .remove(
          "hidden"
        );


      status.textContent =
        "START ni bosing";


      updateCounter();

    }
  );


  /* ==================================================
       RIGHT CLICK / MENU
  ================================================== */

  document.addEventListener(
    "contextmenu",
    function(event) {

      event.preventDefault();

    }
  );


  updateCounter();

</script>

</body>
</html>
